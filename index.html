<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="shortcut icon"
      href="/favicon-32x32.png"
      sizes="32x32"
    />
    <title>FrontendMentor | Maker pre launch</title>
  </head>
  <body>
    <header class="pt-8 pb-16 md:pt-12 md:pb-14.5 lg:pt-20 lg:pb-30">
      <div class="container flex items-center justify-center md:justify-start">
        <a href="#">
          <svg class="h-8.75 w-35">
            <use href="#logo"></use>
          </svg>
        </a>
      </div>
    </header>
    <main>
      <section class="grid justify-center gap-16 overflow-x-hidden">
        <div
          class="relative -right-4 -left-4 flex w-[calc(100%+17px*2)] items-center justify-between md:col-start-1 md:row-start-1 md:min-h-125 md:justify-center md:gap-16 lg:gap-27.5"
        >
          <svg
            class="h-57.5 w-50.75 shrink-0 md:h-86 md:w-75 md:self-start lg:h-114.5 lg:w-100 lg:self-center"
          >
            <use href="#illustration-hero-left"></use>
          </svg>
          <svg class="lg:h-94.5] hidden shrink-0 md:block md:h-69.75 md:w-100.25 lg:w-136">
            <use href="#bg-hero-squiggle"></use>
          </svg>
          <svg class="h-57.5 w-50.75 shrink-0 md:h-86 md:w-75 lg:h-114.5 lg:w-100">
            <use href="#illustration-hero-right"></use>
          </svg>
        </div>
        <div
          class="relative z-10 container flex max-w-162.5 flex-col items-center justify-center gap-8 md:col-start-1 md:row-start-1 md:gap-16"
        >
          <div class="flex flex-col gap-6 text-center">
            <h1 class="text-preset-1 font-extrabold text-white">
              Get paid for the work<br />
              you <span class="text-cyan-400">love</span> to do.
            </h1>
            <p>
              The 9-5 grind is so last century. We believe in living life on your own terms. Whether
              you’re looking to escape the rat race or set up a side hustle, we’ve got you covered.
            </p>
          </div>
          <svg class="h-10.5 w-6.5 animate-bounce">
            <use href="#icon-scroll"></use>
          </svg>
        </div>
      </section>
    </main>
    <script
      type="module"
      src="./src/scripts/main.js"
    ></script>
  </body>
</html>
