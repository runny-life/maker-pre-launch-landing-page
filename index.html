<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-32x32.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>FrontendMentor | Maker pre launch landing page</title>
    <link
      rel="stylesheet"
      href="./src/styles/style.css"
    />
  </head>
  <body>
    <header class="pt-8 pb-16">
      <div class="container flex items-center justify-center md:justify-start">
        <a
          href="#"
          aria-label="Home"
        >
          <svg
            class="h-8.75 w-35"
            aria-hidden="true"
          >
            <use href="#logo"></use>
          </svg>
        </a>
      </div>
    </header>
    <main>
      <section class="relative container">
        <!-- Hero illustrations -->
        <div
          class="pointer-events-none absolute top-[55%] left-1/2 z-0 hidden w-screen -translate-x-1/2 -translate-y-1/2 items-center justify-between md:flex lg:top-[70%]"
        >
          <img
            src="./src/assets/icons/illustration-hero-left.svg"
            alt=""
            width="408"
            height="459"
            class="w-64 lg:w-80 xl:w-102"
          />

          <img
            src="./src/assets/icons/bg-hero-squiggle.svg"
            alt=""
            width="545"
            height="379"
            class="absolute top-1/2 left-1/2 -z-10 w-96 -translate-x-1/2 -translate-y-1/2 lg:w-136.25"
          />

          <img
            src="./src/assets/icons/illustration-hero-right.svg"
            alt=""
            width="408"
            height="459"
            class="w-64 lg:w-80 xl:w-102"
          />
        </div>

        <!-- Mobile illustrations -->
        <div class="grid grid-cols-2 gap-8 md:hidden">
          <img
            src="./src/assets/icons/illustration-hero-left.svg"
            alt=""
            width="408"
            height="459"
            class="w-full"
          />

          <img
            src="./src/assets/icons/illustration-hero-right.svg"
            alt=""
            width="408"
            height="459"
            class="w-full"
          />
        </div>

        <!-- Hero content -->
        <div
          class="relative z-10 mx-auto flex max-w-140 flex-col items-center justify-center gap-8 pt-16 text-center md:gap-16 md:pt-12"
        >
          <div class="grid gap-6">
            <h1 class="text-preset-1 text-neutral font-extrabold">
              Get paid for the work<br />
              you <span class="text-cyan-400">love</span> to do.
            </h1>

            <p>
              The 9-5 grind is so last century. We believe in living life on your own terms. Whether
              you’re looking to escape the rat race or set up a side hustle, we’ve got you covered.
            </p>
          </div>

          <svg
            class="h-10.5 w-6.5 animate-bounce"
            aria-hidden="true"
          >
            <use href="#icon-scroll"></use>
          </svg>
        </div>
      </section>
    </main>
    <script
      type="module"
      src="/src/scripts/main.js"
    ></script>
  </body>
</html>
